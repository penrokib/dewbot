services:
  dewbot-gateway:
    image: ${DEWBOT_IMAGE:-dewbot:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      DEWBOT_GATEWAY_TOKEN: ${DEWBOT_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${DEWBOT_CONFIG_DIR}:/home/node/.dewbot
      - ${DEWBOT_WORKSPACE_DIR}:/home/node/.dewbot/workspace
    ports:
      - "${DEWBOT_GATEWAY_PORT:-18789}:18789"
      - "${DEWBOT_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${DEWBOT_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  dewbot-cli:
    image: ${DEWBOT_IMAGE:-dewbot:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      DEWBOT_GATEWAY_TOKEN: ${DEWBOT_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${DEWBOT_CONFIG_DIR}:/home/node/.dewbot
      - ${DEWBOT_WORKSPACE_DIR}:/home/node/.dewbot/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]

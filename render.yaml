services:
  - type: web
    name: dewbot
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: DEWBOT_STATE_DIR
        value: /data/.dewbot
      - key: DEWBOT_WORKSPACE_DIR
        value: /data/workspace
      - key: DEWBOT_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: dewbot-data
      mountPath: /data
      sizeGB: 1
